<!-- Full-screen background -->
<div class="auth-page">

  <!-- Background image + dark overlay -->
  <div class="auth-bg">
    <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1920&q=80"
         alt="" class="auth-bg-img" />
    <div class="auth-bg-overlay"></div>
  </div>

  <!-- Subtle blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- Centered content -->
  <div class="auth-container">

    <!-- Logo — above the card on the dark bg -->
    <div class="flex items-center justify-center gap-2 mb-6">
      <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center shadow-lg">
        <mat-icon class="text-white" style="font-size:20px;width:20px;height:20px;">home_work</mat-icon>
      </div>
      <span class="text-2xl font-extrabold tracking-tight text-white">ESTATE<span class="text-blue-400">LK</span></span>
    </div>

    <!-- Glass card -->
    <div class="glass-card" data-aos="fade-up" data-aos-duration="600">

      <!-- Heading -->
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-white mb-1">Welcome Back</h1>
        <p class="text-white/60 text-sm">Sign in to your account</p>
      </div>

      <!-- Error -->
      <div *ngIf="errorMessage"
           class="flex items-center gap-2 p-3 mb-5 bg-red-500/20 border border-red-400/30 rounded-xl text-red-200 text-sm">
        <mat-icon style="font-size:18px;width:18px;height:18px;" class="shrink-0">error_outline</mat-icon>
        {{ errorMessage }}
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">

        <!-- Username -->
        <div class="input-group">
          <label class="input-label">Username</label>
          <div class="input-wrapper">
            <mat-icon class="input-icon">person_outline</mat-icon>
            <input
              formControlName="username"
              type="text"
              autocomplete="username"
              placeholder="Enter your username"
              class="glass-input"
            />
          </div>
          <p *ngIf="username?.touched && username?.errors?.['required']" class="input-error">Username is required</p>
          <p *ngIf="username?.touched && username?.errors?.['minlength']" class="input-error">Minimum 3 characters</p>
        </div>

        <!-- Password -->
        <div class="input-group">
          <label class="input-label">Password</label>
          <div class="input-wrapper">
            <mat-icon class="input-icon">lock_outline</mat-icon>
            <input
              formControlName="password"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="current-password"
              placeholder="Enter your password"
              class="glass-input pr-12"
            />
            <button type="button" (click)="togglePasswordVisibility()" class="input-eye-btn">
              <mat-icon style="font-size:18px;width:18px;height:18px;">{{ showPassword ? 'visibility' : 'visibility_off' }}</mat-icon>
            </button>
          </div>
          <p *ngIf="password?.touched && password?.errors?.['required']" class="input-error">Password is required</p>
          <p *ngIf="password?.touched && password?.errors?.['minlength']" class="input-error">Minimum 6 characters</p>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="isLoading || loginForm.invalid"
          class="auth-submit-btn mt-2">
          <span *ngIf="!isLoading" class="flex items-center justify-center gap-2">
            <mat-icon style="font-size:18px;width:18px;height:18px;">login</mat-icon>
            Sign In
          </span>
          <span *ngIf="isLoading" class="flex items-center justify-center gap-2">
            <span class="btn-spinner"></span>
            Signing in...
          </span>
        </button>

      </form>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-6">
        <div class="flex-1 h-px bg-white/15"></div>
        <span class="text-white/40 text-xs font-medium">OR DEMO ACCESS</span>
        <div class="flex-1 h-px bg-white/15"></div>
      </div>

      <!-- Demo Buttons -->
      <div class="grid grid-cols-3 gap-2">
        <button type="button" class="demo-btn">
          <mat-icon style="font-size:14px;width:14px;height:14px;">person</mat-icon>
          Buyer
        </button>
        <button type="button" class="demo-btn">
          <mat-icon style="font-size:14px;width:14px;height:14px;">storefront</mat-icon>
          Seller
        </button>
        <button type="button" class="demo-btn">
          <mat-icon style="font-size:14px;width:14px;height:14px;">admin_panel_settings</mat-icon>
          Admin
        </button>
      </div>

      <!-- Register link -->
      <p class="text-center text-white/50 text-sm mt-6">
        Don't have an account?
        <a routerLink="/register" class="text-blue-400 hover:text-blue-300 font-semibold ml-1 transition-colors">Create one</a>
      </p>

    </div>
  </div>
</div>
