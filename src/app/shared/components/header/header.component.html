<header class="bg-white sticky top-0 z-50">
  <div class="container-max py-6 flex items-center justify-between">
    <!-- Logo -->
    <a routerLink="/marketplace" class="flex items-center">
      <span class="text-2xl font-bold tracking-[0.15em] text-neutral-900" style="font-family: var(--font-family);">ESTATE</span>
    </a>

    <!-- Navigation Links (Desktop) -->
    <nav class="hidden md:flex items-center gap-12">
      <a
        routerLink="/marketplace"
        routerLinkActive="border-b-[1px] border-neutral-900"
        [routerLinkActiveOptions]="{ exact: true }"
        class="label-caps text-neutral-500 hover:text-neutral-900 transition-colors pb-1 border-b-[1px] border-transparent"
        (click)="closeMenu()"
      >
        Marketplace
      </a>
      <a
        routerLink="/services"
        class="label-caps text-neutral-500 hover:text-neutral-900 transition-colors pb-1 border-b-[1px] border-transparent"
        (click)="closeMenu()"
      >
        Services
      </a>
      <a
        routerLink="/journal"
        class="label-caps text-neutral-500 hover:text-neutral-900 transition-colors pb-1 border-b-[1px] border-transparent"
        (click)="closeMenu()"
      >
        Journal
      </a>
      <a
        routerLink="/contact"
        class="label-caps text-neutral-500 hover:text-neutral-900 transition-colors pb-1 border-b-[1px] border-transparent"
        (click)="closeMenu()"
      >
        Contact
      </a>
    </nav>

    <!-- Auth / Icons -->
    <div class="hidden md:flex items-center gap-4">
      <button mat-icon-button class="text-neutral-700 hover:text-neutral-900 transition-colors">
        <mat-icon style="font-size: 20px; width: 20px; height: 20px;">favorite_border</mat-icon>
      </button>

      <ng-container *ngIf="!isAuthenticated">
        <a
          routerLink="/login"
          mat-icon-button
          class="text-neutral-700 hover:text-neutral-900 transition-colors"
          (click)="closeMenu()"
        >
          <mat-icon style="font-size: 20px; width: 20px; height: 20px;">account_circle</mat-icon>
        </a>
      </ng-container>

      <ng-container *ngIf="isAuthenticated && currentUser">
        <a
          [routerLink]="currentUser.activeRoleId === UserRole.SELLER ? '/seller' : (currentUser.activeRoleId === UserRole.ADMIN ? '/admin' : '/dashboard')"
          mat-icon-button
          class="text-neutral-700 hover:text-neutral-900 transition-colors"
          (click)="closeMenu()"
        >
          <mat-icon style="font-size: 20px; width: 20px; height: 20px;">account_circle</mat-icon>
        </a>
      </ng-container>
    </div>

    <!-- Mobile Menu Toggle -->
    <button
      mat-icon-button
      class="md:hidden text-neutral-900"
      (click)="toggleMenu()"
      aria-label="Toggle menu"
    >
      <mat-icon>menu</mat-icon>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div
    *ngIf="isMenuOpen"
    class="md:hidden border-t border-neutral-200 bg-white"
  >
    <div class="px-8 py-6 flex flex-col gap-6">
      <a
        routerLink="/marketplace"
        routerLinkActive="text-neutral-900"
        [routerLinkActiveOptions]="{ exact: true }"
        class="label-caps text-neutral-500 hover:text-neutral-900 transition-colors"
        (click)="closeMenu()"
      >
        Marketplace
      </a>
      <a
        routerLink="/services"
        class="label-caps text-neutral-500 hover:text-neutral-900 transition-colors"
        (click)="closeMenu()"
      >
        Services
      </a>
      
      <hr class="border-neutral-200" />

      <ng-container *ngIf="!isAuthenticated">
        <a
          routerLink="/login"
          class="label-caps text-neutral-900 hover:text-primary-700 transition-colors"
          (click)="closeMenu()"
        >
          Log In / Register
        </a>
      </ng-container>

      <ng-container *ngIf="isAuthenticated && currentUser">
        <a
          [routerLink]="currentUser.activeRoleId === UserRole.SELLER ? '/seller' : (currentUser.activeRoleId === UserRole.ADMIN ? '/admin' : '/dashboard')"
          class="label-caps text-neutral-900 hover:text-primary-700 transition-colors"
          (click)="closeMenu()"
        >
          {{ currentUser.firstName }}'s Dashboard
        </a>
        <button
          (click)="logout()"
          class="label-caps text-error text-left"
        >
          Logout
        </button>
      </ng-container>
    </div>
  </div>
</header>
